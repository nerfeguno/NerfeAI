plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def nerfeaiKeystorePath = System.getenv("NERFEAI_KEYSTORE_PATH")
def nerfeaiStorePassword = System.getenv("NERFEAI_STORE_PASSWORD")
def nerfeaiKeyAlias = System.getenv("NERFEAI_KEY_ALIAS")
def nerfeaiKeyPassword = System.getenv("NERFEAI_KEY_PASSWORD")

def nerfeaiSigningReady =
        nerfeaiKeystorePath &&
        nerfeaiStorePassword &&
        nerfeaiKeyAlias &&
        nerfeaiKeyPassword

android {
    namespace 'com.nerfeai'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.nerfeai'

        minSdk 26
        targetSdk 35

        versionCode 3
        versionName '1.2'

        /*
         * GitHub repository used by the in-app updater.
         *
         * GitHub Actions automatically provides:
         *
         * GITHUB_REPOSITORY=username/repository
         *
         * Example:
         * NerfeGuno/NerfeAI-Android
         */
        buildConfigField(
	        "String",
	        "UPDATE_REPOSITORY",
	        "\"${System.getenv("GITHUB_REPOSITORY") ?: "nerfeguno/NerfeAI"}\""
	)

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    /*
     * Required because MainActivity uses BuildConfig.UPDATE_REPOSITORY.
     */
    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ['gguf']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    /*
     * Permanent signing key for GitHub Releases.
     */
    signingConfigs {
        release {
            if (nerfeaiSigningReady) {
                storeFile file(nerfeaiKeystorePath)
                storePassword nerfeaiStorePassword
                keyAlias nerfeaiKeyAlias
                keyPassword nerfeaiKeyPassword
            }
        }
    }

    buildTypes {

        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false

            /*
             * Use the permanent release key when signing secrets
             * are available. Otherwise use the debug key.
             *
             * This allows assembleDebug to run in GitHub Actions
             * without requiring release signing secrets.
             */
            if (nerfeaiSigningReady) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
