plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def nerfeaiKeystorePath = System.getenv("NERFEAI_KEYSTORE_PATH")
def nerfeaiStorePassword = System.getenv("NERFEAI_STORE_PASSWORD")
def nerfeaiKeyAlias = System.getenv("NERFEAI_KEY_ALIAS")
def nerfeaiKeyPassword = System.getenv("NERFEAI_KEY_PASSWORD")

def nerfeaiSigningReady =
        nerfeaiKeystorePath &&
        nerfeaiStorePassword &&
        nerfeaiKeyAlias &&
        nerfeaiKeyPassword

android {
    namespace 'com.nerfeai'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.nerfeai'

        minSdk 26
        targetSdk 35

        versionCode 4
        versionName '1.3'

        /*
         * ============================================================
         * Automatic release notes from Git commits
         * ============================================================
         *
         * Example:
         *
         * v1.2
         *    ↓
         * commits
         *    ↓
         * v1.3
         *
         * The commits between the previous version tag and the
         * current build are automatically placed into
         * BuildConfig.UPDATE_NOTES.
         */

        def gitTag = "v${versionName}"
        def previousTag = ""

        try {
            previousTag = ["git", "describe", "--tags", "--abbrev=0", "${gitTag}^"]
                    .execute(null, rootDir)
                    .text
                    .trim()
        } catch (Exception ignored) {
            previousTag = ""
        }

        def updateNotes = ""

        try {
            def gitCommand

            if (previousTag) {
                gitCommand = [
                        "git",
                        "log",
                        "--pretty=format:%s",
                        "${previousTag}..HEAD"
                ]
            } else {
                gitCommand = [
                        "git",
                        "log",
                        "--pretty=format:%s",
                        "-10"
                ]
            }

            def gitOutput = gitCommand
                    .execute(null, rootDir)
                    .text
                    .trim()

            if (gitOutput) {
                updateNotes = gitOutput
                        .split("\\r?\\n")
                        .findAll { line ->
                            line &&
                            !line.startsWith("Bump NerfeAI version") &&
                            !line.startsWith("Merge ")
                        }
                        .collect { line ->
                            "• " + line
                        }
                        .join("\n")
            }

            if (!updateNotes) {
                updateNotes = "• Bug fixes and improvements"
            }

        } catch (Exception ignored) {
            updateNotes = "• Bug fixes and improvements"
        }

        /*
         * Escape the Git output so it can safely be stored inside
         * an Android BuildConfig String field.
         */
        def escapedUpdateNotes = updateNotes
                .replace("\\", "\\\\")
                .replace("\"", "\\\"")
                .replace("\r", "")
                .replace("\n", "\\n")

        buildConfigField(
                "String",
                "UPDATE_NOTES",
                "\"${escapedUpdateNotes}\""
        )

        /*
         * GitHub repository used by the update system.
         */
        buildConfigField(
                "String",
                "UPDATE_REPOSITORY",
                "\"${System.getenv("GITHUB_REPOSITORY") ?: "nerfeguno/NerfeAI"}\""
        )

        /*
         * Only build the architecture required by NerfeAI.
         */
        ndk {
            abiFilters 'arm64-v8a'
        }

        /*
         * Native llama.cpp configuration.
         */
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    /*
     * Required because the application uses:
     *
     * BuildConfig.UPDATE_NOTES
     * BuildConfig.UPDATE_REPOSITORY
     */
    buildFeatures {
        buildConfig true
    }

    /*
     * Do not compress GGUF files.
     *
     * This is important for the bundled NerfeAI model.
     */
    androidResources {
        noCompress += ['gguf']
    }

    /*
     * Java/Kotlin compatibility.
     */
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    /*
     * Native CMake project.
     */
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    /*
     * ============================================================
     * Permanent release signing
     * ============================================================
     */
    signingConfigs {
        release {
            if (nerfeaiSigningReady) {
                storeFile file(nerfeaiKeystorePath)
                storePassword nerfeaiStorePassword
                keyAlias nerfeaiKeyAlias
                keyPassword nerfeaiKeyPassword
            }
        }
    }

    buildTypes {

        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false

            /*
             * Use the permanent release key when GitHub Actions
             * signing secrets are available.
             *
             * Otherwise fall back to the debug key so that
             * assembleRelease does not fail during development.
             */
            if (nerfeaiSigningReady) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

/*
 * ================================================================
 * Dependencies
 * ================================================================
 */
dependencies {
    implementation 'androidx.core:core:1.15.0'
}