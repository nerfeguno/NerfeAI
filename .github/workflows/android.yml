name: Build NerfeAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build offline Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout NerfeAI project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download llama.cpp source
        run: |
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            third_party/llama.cpp

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NerfeAI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
