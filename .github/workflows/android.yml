name: Build NerfeAI Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - beta-dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build NerfeAI Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout NerfeAI project
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ------------------------------------------------------------
      # GRADLE
      # ------------------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ------------------------------------------------------------
      # ANDROID BUILD COMPONENTS
      # ------------------------------------------------------------
      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # ------------------------------------------------------------
      # RELEASE SIGNING KEY
      # ------------------------------------------------------------
      - name: Prepare release signing key
        shell: bash
        run: |
          echo "${NERFEAI_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/nerfeai-release.jks"

          test -s "$RUNNER_TEMP/nerfeai-release.jks"

          echo "NERFEAI_KEYSTORE_PATH=$RUNNER_TEMP/nerfeai-release.jks" >> "$GITHUB_ENV"
          echo "NERFEAI_STORE_PASSWORD=${NERFEAI_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "NERFEAI_KEY_ALIAS=${NERFEAI_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "NERFEAI_KEY_PASSWORD=${NERFEAI_KEY_PASSWORD}" >> "$GITHUB_ENV"

          echo "Release signing key prepared."

        env:
          NERFEAI_KEYSTORE_BASE64: ${{ secrets.NERFEAI_KEYSTORE_BASE64 }}
          NERFEAI_STORE_PASSWORD: ${{ secrets.NERFEAI_STORE_PASSWORD }}
          NERFEAI_KEY_ALIAS: ${{ secrets.NERFEAI_KEY_ALIAS }}
          NERFEAI_KEY_PASSWORD: ${{ secrets.NERFEAI_KEY_PASSWORD }}

      # ------------------------------------------------------------
      # LLAMA.CPP
      # ------------------------------------------------------------
      - name: Download llama.cpp source
        run: |
          rm -rf third_party/llama.cpp

          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            third_party/llama.cpp

      # ------------------------------------------------------------
      # QWEN MODEL
      # ------------------------------------------------------------
      - name: Download Qwen model into Android assets
        run: |
          mkdir -p app/src/main/assets

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --output app/src/main/assets/nerfeai-model.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          test "$(stat -c%s app/src/main/assets/nerfeai-model.gguf)" -gt 400000000

          ls -lh app/src/main/assets/nerfeai-model.gguf

      # ------------------------------------------------------------
      # VERSION INFORMATION
      # ------------------------------------------------------------
      - name: Read NerfeAI version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle | head -1)
          VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -1)

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "NerfeAI versionCode: $VERSION_CODE"
          echo "NerfeAI versionName: $VERSION_NAME"

      # ------------------------------------------------------------
      # BUILD RELEASE APK
      # ------------------------------------------------------------
      - name: Build release APK
        run: |
          gradle --no-daemon clean assembleRelease

      # ------------------------------------------------------------
      # VERIFY APK
      # ------------------------------------------------------------
      - name: Verify release APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -1)

          test -n "$APK"
          test -f "$APK"

          echo "Release APK:"
          ls -lh "$APK"

          echo "APK path: $APK"

      # ------------------------------------------------------------
      # PREPARE RELEASE APK
      # ------------------------------------------------------------
      - name: Prepare release files
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -1)

          cp "$APK" "NerfeAI-${VERSION_NAME}.apk"

          SHA256=$(sha256sum "NerfeAI-${VERSION_NAME}.apk" | awk '{print $1}')

          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkName": "NerfeAI-${VERSION_NAME}.apk",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/NerfeAI-${VERSION_NAME}.apk",
            "sha256": "${SHA256}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION_NAME}"
          }
          EOF

          echo "Prepared files:"
          ls -lh "NerfeAI-${VERSION_NAME}.apk"
          ls -lh update.json

          echo
          echo "update.json:"
          cat update.json

      # ------------------------------------------------------------
      # UPLOAD CI ARTIFACT
      # ------------------------------------------------------------
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: NerfeAI-release-${{ env.VERSION_NAME }}
          path: |
            NerfeAI-${{ env.VERSION_NAME }}.apk
            update.json
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ONLY RUNS FOR v* TAGS
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "Creating GitHub Release:"
          echo "$TAG"

          gh release create "$TAG" \
            "NerfeAI-${VERSION_NAME}.apk" \
            update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "NerfeAI ${VERSION_NAME}" \
            --generate-notes \
            --verify-tag
