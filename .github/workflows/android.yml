name: Build NerfeAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - beta-dev

permissions:
  contents: read

jobs:
  build:
    name: Build offline Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout NerfeAI project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download llama.cpp source
        run: |
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            third_party/llama.cpp

      - name: Download Qwen model into Android assets
        run: |
          mkdir -p app/src/main/assets

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --output app/src/main/assets/nerfeai-model.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          test "$(stat -c%s app/src/main/assets/nerfeai-model.gguf)" -gt 400000000

          ls -lh app/src/main/assets/nerfeai-model.gguf

      - name: Build optimized APK
        run: gradle --no-daemon assembleRelease

      - name: List generated APK files
        run: find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NerfeAI-offline-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
