name: Build and Release NerfeAI Android

on:
  workflow_dispatch:

  push:
    branches:
      - beta-dev

    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  build:
    name: Build NerfeAI Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout NerfeAI project
        uses: actions/checkout@v5


      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ---------------------------------------------------------
      # Android build dependencies
      # ---------------------------------------------------------
      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"


      # ---------------------------------------------------------
      # llama.cpp
      # ---------------------------------------------------------
      - name: Download llama.cpp source
        run: |
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            third_party/llama.cpp


      # ---------------------------------------------------------
      # Qwen model
      # ---------------------------------------------------------
      - name: Download Qwen model into Android assets
        run: |
          mkdir -p app/src/main/assets

          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --output app/src/main/assets/nerfeai-model.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

          test "$(stat -c%s app/src/main/assets/nerfeai-model.gguf)" -gt 400000000

          ls -lh app/src/main/assets/nerfeai-model.gguf


      # ---------------------------------------------------------
      # Decode production signing key
      # ---------------------------------------------------------
      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NERFEAI_KEYSTORE_BASE64: ${{ secrets.NERFEAI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NERFEAI_KEYSTORE_BASE64" ]; then
            echo "ERROR: NERFEAI_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nerfeai"

          echo "$NERFEAI_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/nerfeai/nerfeai-release.jks"

          test -s "$RUNNER_TEMP/nerfeai/nerfeai-release.jks"

          echo "NERFEAI_KEYSTORE_PATH=$RUNNER_TEMP/nerfeai/nerfeai-release.jks" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build release APK
        env:
          CI: true

          NERFEAI_STORE_PASSWORD: ${{ secrets.NERFEAI_STORE_PASSWORD }}
          NERFEAI_KEY_ALIAS: ${{ secrets.NERFEAI_KEY_ALIAS }}
          NERFEAI_KEY_PASSWORD: ${{ secrets.NERFEAI_KEY_PASSWORD }}

        run: |
          gradle --no-daemon assembleRelease


      # ---------------------------------------------------------
      # Locate APK
      # ---------------------------------------------------------
      - name: Locate generated APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/release/app-release.apk


      # ---------------------------------------------------------
      # Rename APK
      # ---------------------------------------------------------
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME=$(grep -oP "versionName\s+'[^']+'" app/build.gradle | head -1 | sed "s/.*'\([^']*\)'/\1/")
          VERSION_CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle | head -1)

          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Version name : $VERSION_NAME"
          echo "Version code : $VERSION_CODE"
          echo "Git tag      : $TAG_VERSION"

          if [ "$VERSION_NAME" != "$TAG_VERSION" ]; then
            echo "ERROR: Git tag version does not match versionName."
            echo "Tag: $TAG_VERSION"
            echo "Gradle: $VERSION_NAME"
            exit 1
          fi

          mkdir -p release

          APK_NAME="NerfeAI-v${VERSION_NAME}.apk"

          cp app/build/outputs/apk/release/app-release.apk \
             "release/$APK_NAME"

          SHA256=$(sha256sum "release/$APK_NAME" | awk '{print $1}')

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK_NAME}"

          cat > release/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkName": "${APK_NAME}",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          }
          EOF

          echo "Generated update.json:"
          cat release/update.json

          echo ""
          echo "Release files:"
          ls -lh release/


      # ---------------------------------------------------------
      # Upload normal beta/dev artifact
      # ---------------------------------------------------------
      - name: Upload development APK
        if: github.ref == 'refs/heads/beta-dev'
        uses: actions/upload-artifact@v4
        with:
          name: NerfeAI-offline-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14


      # ---------------------------------------------------------
      # Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.apk \
            release/update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "NerfeAI $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
